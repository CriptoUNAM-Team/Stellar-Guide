name: Validar entregable

on:
  pull_request:
    paths:
      - 'ideas/**'
      - 'participantes/**'

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar estructura del entregable
        shell: bash
        run: |
          set -uo pipefail
          REQUERIDOS=(01-problema.md 02-caso-uso.md 03-modelo.md 04-pitch.md evidencia.md)
          errores=0
          avisos=0

          equipos=$(find ideas -mindepth 1 -maxdepth 1 -type d ! -name 'equipo-00-ejemplo' | sort)

          echo "# Validación del entregable" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$equipos" ]; then
            echo "⚠️ No se encontró ninguna carpeta en \`ideas/\`. ¿Creaste \`ideas/equipo-XX-tu-idea/\`?" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          for dir in $equipos; do
            echo "## \`$dir\`" >> "$GITHUB_STEP_SUMMARY"

            # --- la demo ---
            if [ -f "$dir/demo/index.html" ]; then
              if grep -q "Nombre de su idea" "$dir/demo/index.html"; then
                echo "- ⚠️ \`demo/index.html\` — todavía tiene los textos de ejemplo de la plantilla" >> "$GITHUB_STEP_SUMMARY"
                avisos=$((avisos+1))
              else
                echo "- ✅ \`demo/index.html\` — personalizada" >> "$GITHUB_STEP_SUMMARY"
              fi
              if grep -Eq '"S[A-Z2-7]{55}"|>S[A-Z2-7]{55}<' "$dir/demo/index.html"; then
                echo "- 🚨 **\`demo/index.html\` parece contener una CLAVE SECRETA (S...). Quítenla ya: el repo es público.**" >> "$GITHUB_STEP_SUMMARY"
                errores=$((errores+1))
              fi
            else
              echo "- ❌ **falta \`demo/index.html\`** — copien \`plantillas/demo/index.html\`" >> "$GITHUB_STEP_SUMMARY"
              errores=$((errores+1))
            fi

            for f in "${REQUERIDOS[@]}"; do
              if [ -f "$dir/$f" ]; then
                pendientes=$(grep -c '<[^>]*>' "$dir/$f" || true)
                if [ "$pendientes" -gt 0 ]; then
                  echo "- ⚠️ \`$f\` — quedan **$pendientes** campos \`<...>\` sin llenar" >> "$GITHUB_STEP_SUMMARY"
                  avisos=$((avisos+1))
                else
                  echo "- ✅ \`$f\`" >> "$GITHUB_STEP_SUMMARY"
                fi
              else
                echo "- ❌ **falta \`$f\`**" >> "$GITHUB_STEP_SUMMARY"
                errores=$((errores+1))
              fi
            done
            echo >> "$GITHUB_STEP_SUMMARY"
          done

          participantes=$(find participantes -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "## Participantes registrados" >> "$GITHUB_STEP_SUMMARY"
          echo "- 👤 **$participantes** archivo(s) en \`participantes/\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$participantes" -eq 0 ]; then
            echo "- ⚠️ Ningún integrante creó su archivo individual (métrica M1)" >> "$GITHUB_STEP_SUMMARY"
            avisos=$((avisos+1))
          fi

          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "$errores" -gt 0 ]; then
            echo "### ❌ Hay $errores punto(s) que resolver — revisa la lista de arriba. Corrígelo en tu fork y el PR se actualiza solo." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$avisos" -gt 0 ]; then
            echo "### ⚠️ Estructura completa, pero hay $avisos punto(s) por llenar. Se puede mergear; revísalo antes del pitch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Entregable completo. ¡Listo para el review del mentor!" >> "$GITHUB_STEP_SUMMARY"
          fi
